
name: primer-impacto-airflow

services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile

    command: standalone

    ports:
      - "8088:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ../:/opt/project

    restart: unless-stopped

volumes:
  airflow_home:
